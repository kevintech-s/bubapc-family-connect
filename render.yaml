# Render Blueprint (render.yaml)
# Deploys BUBAPC Family Connect: a web service (API + frontend) and a managed PostgreSQL DB.
#
# HOW TO DEPLOY (Render free tier):
#   1. Create a free account at https://render.com (email + card verification, no charge)
#   2. In the Render dashboard: "New" -> "Blueprint" -> connect your GitHub repo, OR
#      go to render.yaml in "New +" -> Blueprint and paste this file.
#   3. Fill in the required env vars (JWT_SECRET, etc.) when prompted.
#
# NOTE (free tier limits):
#   - Free web services spin down after 15 min of inactivity (wake on request, ~50s cold start).
#   - Free PostgreSQL databases expire after 30 days. Plan to upgrade or migrate before then.

name: bubapc-family-connect

services:
  - type: web
    name: bubapc-family-connect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bubapc-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: bubapc-db
    plan: free
    databaseName: bubapc_family_connect
    user: bubapc
